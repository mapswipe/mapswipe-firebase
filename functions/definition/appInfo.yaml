# yaml-language-server: $schema=https://raw.githubusercontent.com/toggle-corp/typesync/refs/tags/v1.0.0/schema.local.json

FbAppInfoRelease:
  model: alias
  docs: Release notes for a single app version on a platform.
  type:
    type: object
    fields:
      version:
        type: string
      versionCode:
        docs: Sortable number of the version used for range queries. Eg. 3.0.10 -> 3000010
        type: int
      updates:
        docs: What's new in this version (markdown).
        optional: true
        type: string
      incompatibleChanges:
        docs: What won't work on older versions after this release (markdown).
        optional: true
        type: string

FbAppInfo:
  model: alias
  # path: v2/appInfo/{platform}
  docs: Represents version information of the mobile app for a platform (ios/android).
  type:
    type: object
    fields:
      latestVersion:
        docs: Latest version available on the store.
        optional: true
        type: string
      minSupportedVersion:
        docs: Installed versions below this must update.
        type: string
      releases:
        docs: Release notes up to the latest version, keyed by version with "." replaced by "_". Eg. 3_0_10
        optional: true
        type:
          type: map
          valueType: FbAppInfoRelease
